name: Orientation Backend Smoke Test

on:
  push:
    paths:
      - '.github/workflows/backend-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Test Apps Script GET
        shell: bash
        run: |
          set -euo pipefail
          URL='https://script.google.com/macros/s/AKfycbyGoQdR5xgepqns7HpyWoHjfJr4cDEMWaBFHoSzUo3uAFgjrrGZvWUKW2TvPLjIWCdy/exec'
          echo '=== GET ==='
          curl -sS -L -D /tmp/get-headers.txt -o /tmp/get-body.html -w 'HTTP %{http_code}\nFINAL %{url_effective}\n' "$URL"
          sed -n '1,20p' /tmp/get-headers.txt
          head -c 500 /tmp/get-body.html || true
          echo

      - name: Test Apps Script POST
        shell: bash
        run: |
          set -euo pipefail
          URL='https://script.google.com/macros/s/AKfycbyGoQdR5xgepqns7HpyWoHjfJr4cDEMWaBFHoSzUo3uAFgjrrGZvWUKW2TvPLjIWCdy/exec'
          TEST_EMAIL="orientation-smoke-${GITHUB_RUN_ID}@example.com"
          echo "TEST_EMAIL=$TEST_EMAIL"
          echo '=== POST ==='
          curl -sS -L -D /tmp/post-headers.txt -o /tmp/post-body.html -w 'HTTP %{http_code}\nFINAL %{url_effective}\n' \
            -X POST \
            --data-urlencode 'fullName=Orientation Smoke Test' \
            --data-urlencode "email=$TEST_EMAIL" \
            --data-urlencode 'universityId=99999999' \
            --data-urlencode 'faculty=Faculty of Computer Studies · Information Technology & Computing — Computer Science' \
            --data-urlencode 'academicYear=4th Year' \
            --data-urlencode 'phone=01000000000' \
            --data-urlencode 'track=Technical Team' \
            --data-urlencode 'consent=yes' \
            --data-urlencode 'source=github-smoke-test' \
            "$URL"
          sed -n '1,30p' /tmp/post-headers.txt
          head -c 1000 /tmp/post-body.html || true
          echo
